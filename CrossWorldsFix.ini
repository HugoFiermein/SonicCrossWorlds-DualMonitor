;;;;;;;;;; Ultrawide/Narrower ;;;;;;;;;;

[Fix Aspect Ratio]
; Allows the use of ultrawide/narrower aspect ratios (removes black bars).
Enabled = true

[Fix HUD]
; Fixes HUD issues at ultrawide/narrower.
Enabled = true

[Span Racing HUD]
; Spans the single-player racing HUD to fill the entire screen width.
Enabled = false

;;;;;;;;;; Dual Monitor Splitscreen (AMD Eyefinity / NVIDIA Surround) ;;;;;;;;;;

[Dual Monitor Splitscreen]
; Enables dedicated 2-player dual-monitor rendering.
; Player 1 HUD is locked to Monitor 1 (left 50% of 32:9).
; Player 2 HUD is locked to Monitor 2 (right 50% of 32:9).
Enabled = true

; Hides the in-game black vertical divider line in the center,
; since your physical monitor bezels already divide the screens.
HideCenterDividerLine = true

; Mirrors / separates 2-player menus (Ready/Character Select, etc.) across both monitors
; so UI elements do not sit right in the middle across monitor bezels.
Mirror2PMenus = true